set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g set-clipboard on
set -g status-keys vi

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind c new-window -c "#{pane_current_path}"
bind n new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind R respawn-pane -k
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H previous-window
bind -r L next-window
bind Tab last-window
bind w choose-window
bind q display-panes
bind e choose-tree -Zw
bind x kill-pane
bind X kill-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind . command-prompt -I "#S" "rename-session '%%'"
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100
set -g status-style "bg=#343f44,fg=#d3c6aa"
set -g status-left "#[fg=#a7c080,bold] #S #[fg=#475258]|#[default]"
set -g status-right "#[fg=#83c092]%Y-%m-%d #[fg=#dbbc7f]%H:%M "
setw -g window-status-current-format "#[bold,fg=#2d353b,bg=#a7c080] #I:#W "
setw -g window-status-format "#[fg=#d3c6aa,bg=#475258] #I:#W "

# TPM + quality plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
