################
### MONITORS ###
################

# name = resolution@hz, position (logical px), scale
# Both 4K monitors at 2x (200%) scaling, Wacom Cintiq at 1.5x (150%)
monitor = HDMI-A-2, 3840x2160@60,  0x0,    2
monitor = DP-1,     3840x2160@60,  1920x0, 2
monitor = HDMI-A-1, 1920x1080@60,  3840x0, 1.5

# Fallback for any hotplugged monitor
monitor = , preferred, auto, 1

# Dell AW is the primary display — workspace 1 opens here
workspace = 1, monitor:DP-1, default:true


###################
### MY PROGRAMS ###
###################

$terminal    = ghostty
$fileManager = thunar
$menu        = pgrep -x wofi > /dev/null || wofi --show drun


#################
### AUTOSTART ###
#################

exec-once = hyprpolkitagent
exec-once = waybar
exec-once = hyprpanel
exec-once = swaybg -i ~/Pictures/wallpapers/everforest_light.jpg -m fill
# exec-once = pipewire
# exec-once = pipewire-pulse
# exec-once = wireplumber
exec-once = nm-applet --indicator
# Clipboard history (wl-clipboard + cliphist)
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#############################
### ENVIRONMENT VARIABLES ###
#############################

# Wayland / AMD
env = LIBVA_DRIVER_NAME,radeonsi
env = GBM_BACKEND,radeonsi
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt Wayland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK / Electron / SDL
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# HiDPI cursor — 24px looks good
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24


source = ~/.config/hypr/theme.conf

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 4
    gaps_out = 8

    border_size = 2

    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding       = 8
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 0.93

    shadow {
        enabled      = true
        range        = 12
        render_power = 3
        color        = rgba(00000066)
    }

    blur {
        enabled  = true
        size     = 6
        passes   = 3
        noise    = 0.02
        vibrancy = 0.18
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,  default
    animation = border,        1, 5,   easeOutQuint
    animation = windows,       1, 4,   easeOutQuint
    animation = windowsIn,     1, 4,   easeOutQuint, popin 85%
    animation = windowsOut,    1, 2,   linear,       popin 85%
    animation = fadeIn,        1, 2,   almostLinear
    animation = fadeOut,       1, 1.5, almostLinear
    animation = fade,          1, 3,   quick
    animation = layers,        1, 4,   easeOutQuint
    animation = layersIn,      1, 4,   easeOutQuint, fade
    animation = layersOut,     1, 1.5, linear,       fade
    animation = workspaces,    1, 2,   almostLinear, fade
    animation = workspacesIn,  1, 1.5, almostLinear, fade
    animation = workspacesOut, 1, 2,   almostLinear, fade
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0   # 0 = disable default wallpaper
    disable_hyprland_logo   = true
    vfr                     = true   # variable frame rate — saves power on idle
}


#############
### INPUT ###
#############

input {
    kb_layout    = us
    follow_mouse = 0
    float_switch_override_focus = 0
    sensitivity  = 0

    touchpad {
        natural_scroll = false
    }
}

# Wacom tablet — pen device passthrough
device {
    name    = wacom-cintiq-16-pen
    enabled = true
}


####################
### KEYBINDINGS  ###
####################

$mainMod = SUPER

# ── Core actions ──────────────────────────────────────────────────────────────
bind = $mainMod,       Return, exec,        $terminal
bind = $mainMod,       Q,      killactive
bind = $mainMod,       E,      exec,        $fileManager
bind = $mainMod,       R,      exec,        $menu
bind = $mainMod SHIFT, E,      exec,        powermenu
bind = $mainMod SHIFT, R,      exec,        hyprctl reload
bind = $mainMod SHIFT, T,      exec,        ~/.local/bin/toggle-theme.sh

# ── Layout / floating ─────────────────────────────────────────────────────────
bind = $mainMod,       V, togglefloating
bind = $mainMod,       F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1      # maximise (keep bar)
bind = $mainMod,       P, pseudo               # dwindle pseudotile
bind = $mainMod,       T, layoutmsg, togglesplit

# ── Clipboard (cliphist + wofi) ───────────────────────────────────────────────
bind = $mainMod,       Z, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ── Screenshot (requires grim + slurp) ───────────────────────────────────────
bind =        , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT,   Print, exec, grim ~/Pictures/screenshot-$(date +%F_%T).png

# ── Focus — arrow keys AND vim hjkl ──────────────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H,     movefocus, l
bind = $mainMod, L,     movefocus, r
bind = $mainMod, K,     movefocus, u
bind = $mainMod, J,     movefocus, d

# ── Move windows ──────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d
bind = $mainMod SHIFT, H,     movewindow, l
bind = $mainMod SHIFT, L,     movewindow, r
bind = $mainMod SHIFT, K,     movewindow, u
bind = $mainMod SHIFT, J,     movewindow, d

# ── Resize (SUPER + CTRL + arrows / hjkl) ────────────────────────────────────
binde = $mainMod CTRL, right, resizeactive,  40  0
binde = $mainMod CTRL, left,  resizeactive, -40  0
binde = $mainMod CTRL, up,    resizeactive,   0 -40
binde = $mainMod CTRL, down,  resizeactive,   0  40
binde = $mainMod CTRL, L,     resizeactive,  40  0
binde = $mainMod CTRL, H,     resizeactive, -40  0
binde = $mainMod CTRL, K,     resizeactive,   0 -40
binde = $mainMod CTRL, J,     resizeactive,   0  40

# ── Workspaces 1–10 ──────────────────────────────────────────────────────────
bind = $mainMod,       1, workspace, 1
bind = $mainMod,       2, workspace, 2
bind = $mainMod,       3, workspace, 3
bind = $mainMod,       4, workspace, 4
bind = $mainMod,       5, workspace, 5
bind = $mainMod,       6, workspace, 6
bind = $mainMod,       7, workspace, 7
bind = $mainMod,       8, workspace, 8
bind = $mainMod,       9, workspace, 9
bind = $mainMod,       0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Scratchpad ────────────────────────────────────────────────────────────────
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# ── Scroll / mouse workspace switching ───────────────────────────────────────
bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1
bindm = $mainMod, mouse:272,  movewindow
bindm = $mainMod, mouse:273,  resizewindow

# ── Audio / media keys ────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume    @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@   toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPause,       exec, playerctl play-pause
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioPrev,        exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name  = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Dolphin file picker floats at a comfortable size
    name  = dolphin-picker
    match:class = dolphin
    match:title = ^(Open|Save)
    float  = true
    size   = 900 600
    center = true
}

windowrule {
    # Fix XWayland drag issues
    name  = fix-xwayland-drags
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = true
    match:float      = true
    match:fullscreen = false
    match:pin        = false
    no_focus = true
}

windowrule = opacity 1.0 override 1.0 override, match:class ^(discord)$

# ── Wofi layer rules (Fixes transparency and artifacts) ───────────
layerrule {
    name            = wofi
    blur            = on
    ignore_alpha    = 0.5
}

# ── HyprPanel sidebar blur ────────────────────────────────────────
layerrule {
    name            = hyprpanel
    blur            = on
    ignore_alpha    = 0.2
}

